# Every colour of the wallpaper palette under its matugen name; hyprlock.nix picks the ones it draws. `$name_panel`
# is the same colour with the alpha of a floating panel, because hyprlang cannot change the alpha of a variable.
<* for name, value in colors *>
${{name}} = rgba({{value.default.hex_stripped}}ff)
${{name}}_panel = rgba({{value.default.hex_stripped}}@panel_alpha_hex@)
<* endfor *>

# The mapping of the palette to the terminal: kitty has no variables. The background opacity is in kitty.nix.
foreground {{colors.on_surface.default.hex}}
background {{colors.surface.default.hex}}
cursor {{colors.primary.default.hex}}
cursor_text_color {{colors.on_primary.default.hex}}
selection_foreground {{colors.on_primary.default.hex}}
selection_background {{colors.primary.default.hex}}
url_color {{colors.primary.default.hex}}

# ANSI colours: zsh, ls, git and every TUI follow them. Black stays dark and white light in both modes (the only
# choice that depends on the mode, style/). Red is the Material error colour, green and yellow are custom colours of
# the wallpaper's scheme (wallpaper/palettes.nix), blue, magenta and cyan are the Material accents; the bright
# colours equal the normal ones.
color0 {{colors.@ansi_black@.default.hex}}
color8 {{colors.outline.default.hex}}
color1 {{colors.error.default.hex}}
color9 {{colors.error.default.hex}}
color2 {{colors.green.default.hex}}
color10 {{colors.green.default.hex}}
color3 {{colors.yellow.default.hex}}
color11 {{colors.yellow.default.hex}}
color4 {{colors.primary.default.hex}}
color12 {{colors.primary.default.hex}}
color5 {{colors.tertiary.default.hex}}
color13 {{colors.tertiary.default.hex}}
color6 {{colors.secondary.default.hex}}
color14 {{colors.secondary.default.hex}}
color7 {{colors.@ansi_white@.default.hex}}
color15 {{colors.@ansi_bright_white@.default.hex}}
# The prompt pill of starship: the active fill and its text. Slots 16 and up are outside the 16 ANSI colours, so a
# terminal without this palette shows the colours of the 256-colour cube there.
color16 {{colors.on_secondary_container.default.hex}}
color17 {{colors.secondary_container.default.hex}}

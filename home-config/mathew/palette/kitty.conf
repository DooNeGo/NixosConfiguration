foreground {{colors.@role_text@.default.hex | lighten: @text_soften@}}
background {{colors.surface.default.hex}}
background_opacity @terminal_opacity@
cursor {{colors.primary.default.hex | lighten: @accent_soften@}}
cursor_text_color {{colors.on_primary.default.hex | lighten: @on_accent_soften@}}
selection_foreground {{colors.on_primary.default.hex | lighten: @on_accent_soften@}}
selection_background {{colors.primary.default.hex | lighten: @accent_soften@}}
url_color {{colors.primary.default.hex | lighten: @accent_soften@}}

# ANSI colours: zsh, ls, git and every TUI follow them. Black stays dark and white light in both modes (the roles are
# in style/). Red is the Material error colour, green and yellow are custom colours of the wallpaper's scheme (wallpaper/)
# that keep their own hue, so they stay recognisably green and yellow; blue, magenta and cyan are the Material accents.
# The accents are softened (style/) so that they are not harsher than the text.
color0 {{colors.@role_ansi_black@.default.hex}}
color8 {{colors.outline.default.hex}}
color1 {{colors.error.default.hex | lighten: @accent_soften@}}
color9 {{colors.error.default.hex | lighten: @accent_soften@}}
color2 {{colors.green.default.hex | lighten: @accent_soften@}}
color10 {{colors.green.default.hex | lighten: @accent_soften@}}
color3 {{colors.yellow.default.hex | lighten: @accent_soften@}}
color11 {{colors.yellow.default.hex | lighten: @accent_soften@}}
color4 {{colors.primary.default.hex | lighten: @accent_soften@}}
color12 {{colors.primary.default.hex | lighten: @accent_soften@}}
color5 {{colors.tertiary.default.hex | lighten: @accent_soften@}}
color13 {{colors.tertiary.default.hex | lighten: @accent_soften@}}
color6 {{colors.secondary.default.hex | lighten: @accent_soften@}}
color14 {{colors.secondary.default.hex | lighten: @accent_soften@}}
color7 {{colors.@role_ansi_white@.default.hex}}
color15 {{colors.@role_ansi_bright_white@.default.hex}}
# The prompt pill of starship: the fill and the text of the accent container (dark with light text in the dark mode,
# light with dark text in the light mode). Slots 16 and up are outside the 16 ANSI colours, so a terminal without this
# palette shows the colours of the 256-colour cube there.
color16 {{colors.on_primary_container.default.hex}}
color17 {{colors.primary_container.default.hex}}
